version: '3'

silent: true

vars:
  BINARY: nameless-streamhata-backend
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: latest
  COVERAGE_FILE: coverage.out

tasks:
  tools:
    desc: Install/update development tools
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}}

  fmt:
    desc: Format the code (gofmt, gofumpt, goimports)
    cmds:
      - golangci-lint fmt

  fmt:check:
    desc: Check formatting without modifying files
    cmds:
      - golangci-lint fmt --diff

  lint:
    desc: Run all linters
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run all linters and apply autofixes
    cmds:
      - golangci-lint run --fix

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy and verify module dependencies
    cmds:
      - go mod tidy
      - go mod verify

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race -shuffle=on -count=1 ./...

  test:cover:
    desc: Run tests and print coverage summary
    cmds:
      - go test -race -shuffle=on -covermode=atomic -coverprofile={{.COVERAGE_FILE}} ./...
      - go tool cover -func={{.COVERAGE_FILE}}

  build:
    desc: Build the binary into ./bin
    cmds:
      - go build -trimpath -ldflags="-s -w" -o bin/{{.BINARY}} .

  run:
    desc: Run the application
    cmds:
      - go run .

  vuln:
    desc: Check for known vulnerabilities
    cmds:
      - govulncheck ./...

  ci:
    desc: Run the full CI pipeline
    cmds:
      - task: fmt:check
      - task: lint
      - task: vet
      - task: test
      - task: build
      - task: vuln

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin {{.COVERAGE_FILE}}
