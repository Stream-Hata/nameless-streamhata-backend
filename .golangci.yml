# golangci-lint configuration.
# Assembled from the Go style guides and production configs of Google, Uber,
# and the Go team: https://google.github.io/styleguide/go/
# https://github.com/uber-go/guide
# https://go.dev/wiki/CodeReviewComments
version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    # --- default / go vet family -------------------------------------------
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # --- correctness --------------------------------------------------------
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecksumtype
    - iface
    - iotamixing
    - makezero
    - mirror
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - spancheck
    - sqlclosecheck
    - wastedassign

    # --- error handling (Uber / Google style) ------------------------------
    - err113
    - wrapcheck

    # --- security -----------------------------------------------------------
    - gosec

    # --- style / maintainability -------------------------------------------
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - embeddedstructfieldcheck
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - cyclop
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - grouper
    - interfacebloat
    - intrange
    - lll
    - maintidx
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - revive
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - whitespace
    - wsl_v5

    # --- globalization / logging -------------------------------------------
    - gosmopolitan
    - loggercheck
    - sloglint

    # --- tests --------------------------------------------------------------
    - paralleltest

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: deprecated since Go 1.16; use io and os
            - pkg: github.com/pkg/errors
              desc: deprecated; use fmt.Errorf with %w
            - pkg: golang.org/x/net/context
              desc: deprecated; use the standard context package
            - pkg: github.com/golang/protobuf
              desc: deprecated; use google.golang.org/protobuf

    errcheck:
      check-type-assertions: true
      check-blank: true

    exhaustive:
      default-signifies-exhaustive: false

    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 20

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - whyNoLint
        - hugeParam
        - rangeValCopy
        - unnamedResult
        - paramTypeCombine

    gocyclo:
      min-complexity: 15

    cyclop:
      max-complexity: 15

    godot:
      scope: declarations

    gosec:
      excludes:
        - G404

    govet:
      enable-all: true
      disable:
        - fieldalignment

    lll:
      line-length: 120

    maintidx:
      under: 20

    nestif:
      min-complexity: 5

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
            - sayRepetitiveInsteadOfStutters
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

    tagliatelle:
      case:
        rules:
          json: camel
          yaml: camel
          xml: camel
          bson: camel
          avro: snake
          toml: snake
          mapstructure: camel

    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - err113
          - funlen
          - gochecknoglobals
          - goconst
          - lll
          - maintidx
          - wrapcheck
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/p7x-dev/rgg-inv-backend
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-order:
    - linter
    - file
  show-stats: true
